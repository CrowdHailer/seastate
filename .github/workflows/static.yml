name: Build forecast artwork and deploy to Pages

on:
  push:
    branches: ["main"]

  # Daily, just after midnight UK time (00:17 UTC is 00:17 GMT / 01:17 BST).
  schedule:
    - cron: "17 0 * * *"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Fetch weather, marine and astronomy data
        run: node fetch-data.mjs

      - name: Paint and render artwork
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: kimi-k2.6
          OLLAMA_CONCURRENCY: '3'
        run: node build-art.mjs

      - name: Assemble site
        env:
          TZ: Europe/London
        run: |
          cp index.html _site/index.html
          timestamp=$(date '+%d %B %Y at %H:%M:%S %Z')
          sed -i "s|__LAST_UPDATED__|$timestamp|g" _site/index.html
          touch _site/.nojekyll
          du -sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
